<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agency OS — Test Motion Graphics Composition</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #05080E;
      color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .preview-box {
      width: 360px;
      height: 640px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,255,255,0.1);
      position: relative;
    }
    canvas { width: 100%; height: 100%; display: block; }
    .status {
      margin-top: 14px;
      font-size: 13px;
      color: #10B981;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <div class="preview-box">
    <canvas id="stage" width="1080" height="1920"></canvas>
  </div>
  <div class="status" id="status">AGENCY OS VERIFICATION RENDER: 60 FPS</div>

  <script>
    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d');
    let startTime = null;

    function easeOutExpo(x) {
      return x === 1 ? 1 : 1 - Math.pow(2, -10 * x);
    }

    function render(timestamp) {
      if (!startTime) startTime = timestamp;
      const progress = Math.min((timestamp - startTime) / 3000, 1.0); // 3s loop
      const ease = easeOutExpo(progress);

      const w = canvas.width;
      const h = canvas.height;

      // Dark Obsidian Gradient
      const bg = ctx.createLinearGradient(0, 0, w, h);
      bg.addColorStop(0, '#090D16');
      bg.addColorStop(1, '#05070B');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, w, h);

      // Kinetic Hexagonal Grid Particle
      ctx.strokeStyle = 'rgba(99, 102, 241, 0.15)';
      ctx.lineWidth = 2;
      for (let i = 0; i < 6; i++) {
        ctx.beginPath();
        const rad = 200 + i * 80 + Math.sin(timestamp * 0.002 + i) * 20;
        ctx.arc(w / 2, h / 2 - 80, rad, 0, Math.PI * 2);
        ctx.stroke();
      }

      // Emerald Accent Pill
      ctx.save();
      const pillY = 600 - (1 - ease) * 100;
      ctx.globalAlpha = ease;
      ctx.fillStyle = '#10B981';
      ctx.shadowColor = '#10B981';
      ctx.shadowBlur = 24;
      ctx.beginPath();
      ctx.roundRect(w / 2 - 180, pillY, 360, 64, 32);
      ctx.fill();

      ctx.shadowBlur = 0;
      ctx.fillStyle = '#090D16';
      ctx.font = 'bold 30px -apple-system, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('AGENCY OS • VERIFIED', w / 2, pillY + 44);
      ctx.restore();

      // Hero Title
      ctx.save();
      const titleY = 760 - (1 - ease) * 80;
      ctx.globalAlpha = ease;
      ctx.fillStyle = '#F8FAFC';
      ctx.font = '900 86px -apple-system, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('STRATIQ', w / 2, titleY);

      ctx.fillStyle = '#6366F1';
      ctx.font = '700 48px -apple-system, sans-serif';
      ctx.fillText('INTELLIGENCE', w / 2, titleY + 70);

      // Description Box
      ctx.fillStyle = '#64748B';
      ctx.font = '400 32px -apple-system, sans-serif';
      ctx.fillText('Autonomous Marketing Operations', w / 2, titleY + 160);
      ctx.fillText('Zero Budget • 100% Deterministic', w / 2, titleY + 210);
      ctx.restore();

      requestAnimationFrame(render);
    }

    requestAnimationFrame(render);
  </script>
</body>
</html>
